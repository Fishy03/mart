<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MEGA MART Self-Service Kiosk Outlet</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#e53e3e',
            secondary: '#4299e1',
          },
          borderRadius: {
            'none': '0px',
            'sm': '4px',
            DEFAULT: '8px',
            'md': '12px',
            'lg': '16px',
            'xl': '20px',
            '2xl': '24px',
            '3xl': '32px',
            'full': '9999px',
            'button': '8px',
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="min-h-screen">
    <header class="bg-white shadow-md py-4 px-6">
        <div class="container mx-auto">
          <!-- logo -->
          <div class="flex justify-center mb-6">
            <h1 class="text-4xl font-['Pacifico'] text-primary">MEGA MART</h1>
          </div>
          <div class="flex items-center gap-4">
            <!--location-->
            <div class="flex justify-between bg-gray-50 border border-gray-300 rounded p-2 w-[50px]">
              <button class="mt-1 text-primary text-sm font-semibold !rounded-button">
                <svg class="h-8 w-8 text-red-500"  fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
              </button>
            </div>
            <!-- search bar -->
            <div class="relative flex-grow">
              <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                <div class="w-6 h-6 flex items-center justify-center text-gray-500">
                  <i class="ri-search-line ri-lg"></i>
                </div>
              </div>
              <input
                type="text"
                class="w-full pl-12 pr-4 py-3 text-lg bg-gray-50 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary"
                placeholder="Search for products..."/>
            </div>
            <!-- cart -->
            <div class="flex items-center bg-gray-50 border border-gray-300 rounded p-3 min-w-[220px]">
              <div class="relative mr-4">
                <div class="w-10 h-10 flex items-center justify-center text-primary">
                  <i class="ri-shopping-cart-2-line ri-2x"></i>
                </div>
                <span class="cart-badge flex items-center justify-center w-6 h-6 bg-primary text-white text-xs font-bold rounded-full">0</span>
              </div>
              <div>
                <p class="text-sm text-gray-600">
                  Total: <span class="font-bold text-gray-800">₹0</span>
                </p>
                <a href="\mart\test\checkout.html">
                <button class="mt-1 text-primary text-sm font-semibold !rounded-button">
                  View Cart
                </button>
                </a>
              </div>
            </div>
          </div>
        </div>
      </header>
      <main class="container mx-auto px-6 py-8">
        <!-- cate head -->
        <div id="meat-seafood-section" class="flex items-center gap-4 mb-8">
          <button
            onclick="history.back()"
            class="w-10 h-10 flex items-center justify-center bg-white border border-gray-300 rounded-full shadow-sm hover:bg-gray-50 !rounded-button">
            <i class="ri-arrow-left-s-line ri-lg"></i>
          </button>
          <h1 class="text-3xl font-bold text-gray-800">Beverages</h1>
        </div>
        <!-- sort -->
        <div class="flex gap-3 mb-8 overflow-x-auto pb-2">
          <button class="bg-primary text-white px-4 py-2 rounded-full text-sm font-medium !rounded-button whitespace-nowrap">
            All Items
          </button>
          <button class="bg-white text-gray-700 px-4 py-2 rounded-full text-sm font-medium border border-gray-300 hover:bg-gray-50 !rounded-button whitespace-nowrap">
            Soft Drinks
          </button>
          <button class="bg-white text-gray-700 px-4 py-2 rounded-full text-sm font-medium border border-gray-300 hover:bg-gray-50 !rounded-button whitespace-nowrap">
            Water
          </button>
          <button class="bg-white text-gray-700 px-4 py-2 rounded-full text-sm font-medium border border-gray-300 hover:bg-gray-50 !rounded-button whitespace-nowrap">
            Juices
          </button>
          <button class="bg-white text-gray-700 px-4 py-2 rounded-full text-sm font-medium border border-gray-300 hover:bg-gray-50 !rounded-button whitespace-nowrap">
            Energy Drinks
          </button>
          <button class="bg-white text-gray-700 px-4 py-2 rounded-full text-sm font-medium border border-gray-300 hover:bg-gray-50 !rounded-button whitespace-nowrap">
            Coffee & Tea
          </button>
        </div>
        <!-- filter sort -->
        <div class="flex justify-between items-center mb-6">
          <div class="flex items-center gap-4">
            <div class="relative">
              <button class="flex items-center gap-2 bg-white px-4 py-2 rounded-lg border border-gray-300 text-sm font-medium hover:bg-gray-50 !rounded-button">
                <i class="ri-filter-3-line"></i>
                Filters
                <i class="ri-arrow-down-s-line"></i>
              </button>
            </div>
            <div class="relative">
              <button class="flex items-center gap-2 bg-white px-4 py-2 rounded-lg border border-gray-300 text-sm font-medium hover:bg-gray-50 !rounded-button">
                <i class="ri-sort-desc"></i>
                Sort by: Price
                <i class="ri-arrow-down-s-line"></i>
              </button>
            </div>
          </div>
          <div class="text-sm text-gray-600">Showing 8 items</div>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
          <!--1-->
          <div class="product-card bg-white rounded-lg shadow-md overflow-hidden">
            <div class="h-48 bg-gray-200">
              <img
                src="https://blenderartists.org/uploads/default/original/4X/0/e/a/0ead55511358229b83f8b2ba9f9d87f64a8334bd.jpeg"
                alt="Coca Cola Classic"
                class="w-full h-full object-cover object-top"/>
            </div>
            <div class="p-4">
              <div class="flex items-center gap-2 mb-2">
                <span class="bg-blue-100 text-blue-800 text-xs font-medium px-2 py-1 rounded">Popular</span>
              </div>
              <h3 class="font-semibold text-gray-800">Coca Cola Classic</h3>
              <!-- <p class="text-sm text-gray-600 mt-1">12-Pack Cans</p> -->
              <div class="flex justify-between items-center mt-3">
                <p class="font-bold text-primary">₹50</p>
                <button class="bg-primary text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-red-700 !rounded-button whitespace-nowrap">
                  Add to Cart
                </button>
              </div>
            </div>
          </div>
          <!--2-->
          <div class="product-card bg-white rounded-lg shadow-md overflow-hidden">
            <div class="h-48 bg-gray-200">
              <img
                src="https://justwater.com/cdn/shop/files/Group_14_097869cf-2c15-4997-a944-997a67cd68b8.png?v=1681486583&width=1500"
                alt="Spring Water"
                class="w-full h-full object-cover object-top"/>
            </div>
            <div class="p-4">
              <div class="flex items-center gap-2 mb-2">
                <span class="bg-blue-100 text-blue-800 text-xs font-medium px-2 py-1 rounded">Natural</span>
              </div>
              <h3 class="font-semibold text-gray-800">Spring Water</h3>
              <!-- <p class="text-sm text-gray-600 mt-1">24-Pack Bottles</p> -->
              <div class="flex justify-between items-center mt-3">
                <p class="font-bold text-primary">₹150</p>
                <button class="bg-primary text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-red-700 !rounded-button whitespace-nowrap">
                  Add to Cart
                </button>
              </div>
            </div>
          </div>
          <!--3-->
          <div class="product-card bg-white rounded-lg shadow-md overflow-hidden">
            <div class="h-48 bg-gray-200">
              <img
                src="https://i.pinimg.com/736x/0d/18/0a/0d180a77267e6c333fe66db5b1eaf7c9.jpg"
                alt="Fresh Orange Juice"
                class="w-full h-full object-cover object-top"/>
            </div>
            <div class="p-4">
              <div class="flex items-center gap-2 mb-2">
                <span class="bg-blue-100 text-blue-800 text-xs font-medium px-2 py-1 rounded">Fresh</span>
              </div>
              <h3 class="font-semibold text-gray-800">Pepsi</h3>
              <!-- <p class="text-sm text-gray-600 mt-1">No Added Sugar</p> -->
              <div class="flex justify-between items-center mt-3">
                <p class="font-bold text-primary">₹50</p>
                <button class="bg-primary text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-red-700 !rounded-button whitespace-nowrap">
                  Add to Cart
                </button>
              </div>
            </div>
          </div>
          <!--4-->
          <div class="product-card bg-white rounded-lg shadow-md overflow-hidden">
            <div class="h-48 bg-gray-200">
              <img
                src="https://welzo.com/cdn/shop/articles/red-bull-nutrition-facts-welzo.jpg?v=1710941669&width=1420"
                alt="Red Bull Energy"
                class="w-full h-full object-cover object-top"/>
            </div>
            <div class="p-4">
              <div class="flex items-center gap-2 mb-2">
                <span class="bg-blue-100 text-blue-800 text-xs font-medium px-2 py-1 rounded">Energy</span>
              </div>
              <h3 class="font-semibold text-gray-800">Red Bull Energy</h3>
              <!-- <p class="text-sm text-gray-600 mt-1">6-Pack</p> -->
              <div class="flex justify-between items-center mt-3">
                <p class="font-bold text-primary">₹50</p>
                <button class="bg-primary text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-red-700 !rounded-button whitespace-nowrap">
                  Add to Cart
                </button>
              </div>
            </div>
          </div>
          <!--5-->
          <div class="product-card bg-white rounded-lg shadow-md overflow-hidden">
            <div class="h-48 bg-gray-200">
              <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQv5xUc-4K_Obk35otEVIzo36isTRNyi3AWhw&s"
                alt="Sprite"
                class="w-full h-full object-cover object-top"/>
            </div>
            <div class="p-4">
              <div class="flex items-center gap-2 mb-2">
                <span class="bg-blue-100 text-blue-800 text-xs font-medium px-2 py-1 rounded">Popular</span>
              </div>
              <h3 class="font-semibold text-gray-800">Sprite</h3>
              <!-- <p class="text-sm text-gray-600 mt-1">Arabica Blend</p> -->
              <div class="flex justify-between items-center mt-3">
                <p class="font-bold text-primary">₹50</p>
                <button class="bg-primary text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-red-700 !rounded-button whitespace-nowrap">
                  Add to Cart
                </button>
              </div>
            </div>
          </div>
          <!--6-->
          <div class="product-card bg-white rounded-lg shadow-md overflow-hidden">
            <div class="h-48 bg-gray-200">
              <img
                src="https://i.pinimg.com/736x/3e/b2/7d/3eb27d2000ee5dce0f4e35e5b97df63e.jpg"
                alt="Sting Energy drink"
                class="w-full h-full object-cover object-top"/>
            </div>
            <div class="p-4">
              <div class="flex items-center gap-2 mb-2">
                <span class="bg-blue-100 text-blue-800 text-xs font-medium px-2 py-1 rounded">Popular</span>
              </div>
              <h3 class="font-semibold text-gray-800">7Up</h3>
              <!-- <p class="text-sm text-gray-600 mt-1">Loose Leaf</p> -->
              <div class="flex justify-between items-center mt-3">
                <p class="font-bold text-primary">₹50</p>
                <button class="bg-primary text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-red-700 !rounded-button whitespace-nowrap">
                  Add to Cart
                </button>
              </div>
            </div>
          </div>
          <!--7-->
          <div class="product-card bg-white rounded-lg shadow-md overflow-hidden">
            <div class="h-48 bg-gray-200">
              <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTHo5GGaRfqhll9psM-qnjH45lzlWjj-A2Fog&s"
                alt="Sparkling Water"
                class="w-full h-full object-cover object-top"/>
            </div>
            <div class="p-4">
              <div class="flex items-center gap-2 mb-2">
                <span class="bg-blue-100 text-blue-800 text-xs font-medium px-2 py-1 rounded">Sparkling</span>
              </div>
              <h3 class="font-semibold text-gray-800">Sparkling Water</h3>
              <!-- <p class="text-sm text-gray-600 mt-1">12-Pack Variety</p> -->
              <div class="flex justify-between items-center mt-3">
                <p class="font-bold text-primary">₹200</p>
                <button class="bg-primary text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-red-700 !rounded-button whitespace-nowrap">
                  Add to Cart
                </button>
              </div>
            </div>
          </div>
          <!--8-->
          <div class="product-card bg-white rounded-lg shadow-md overflow-hidden">
            <div class="h-48 bg-gray-200">
              <img
                src="https://i.pinimg.com/736x/8c/3f/1a/8c3f1a8b843a11cdc7f87fcaadd8bf72.jpg"
                alt="Coconut Water"
                class="w-full h-full object-cover object-top"/>
            </div>
            <div class="p-4">
              <div class="flex items-center gap-2 mb-2">
                <!-- <span class="bg-blue-100 text-blue-800 text-xs font-medium px-2 py-1 rounded">Natural</span> -->
              </div>
              <h3 class="font-semibold text-gray-800">Fanta</h3>
              <!-- <p class="text-sm text-gray-600 mt-1">100% Pure</p> -->
              <div class="flex justify-between items-center mt-3">
                <p class="font-bold text-primary">₹50</p>
                <button class="bg-primary text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-red-700 !rounded-button whitespace-nowrap">
                  Add to Cart
                </button>
              </div>
            </div>
          </div>
        </div>
        <!-- page no. -->
        <div class="flex justify-center items-center gap-2 mt-12">
          <button class="w-10 h-10 flex items-center justify-center bg-white border border-gray-300 rounded-full shadow-sm hover:bg-gray-50 !rounded-button">
            <i class="ri-arrow-left-s-line ri-lg"></i>
          </button>
          <button class="w-10 h-10 flex items-center justify-center bg-primary text-white rounded-full shadow-sm !rounded-button">
            1
          </button>
          <button class="w-10 h-10 flex items-center justify-center bg-white border border-gray-300 rounded-full shadow-sm hover:bg-gray-50 !rounded-button">
            2
          </button>
          <button class="w-10 h-10 flex items-center justify-center bg-white border border-gray-300 rounded-full shadow-sm hover:bg-gray-50 !rounded-button">
            3
          </button>
          <button class="w-10 h-10 flex items-center justify-center bg-white border border-gray-300 rounded-full shadow-sm hover:bg-gray-50 !rounded-button">
            <i class="ri-arrow-right-s-line ri-lg"></i>
          </button>
        </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
