<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MEGA MART Self-Service Kiosk Outlet</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#e53e3e',
            secondary: '#4299e1',
          },
          borderRadius: {
            'none': '0px',
            'sm': '4px',
            DEFAULT: '8px',
            'md': '12px',
            'lg': '16px',
            'xl': '20px',
            '2xl': '24px',
            '3xl': '32px',
            'full': '9999px',
            'button': '8px',
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="min-h-screen">
    <header class="bg-white shadow-md py-4 px-6">
        <div class="container mx-auto">
          <!--logo-->
          <div class="flex justify-center mb-6">
            <h1 class="text-4xl font-['Pacifico'] text-primary">MEGA MART</h1>
          </div>
          <div class="flex items-center gap-4">
            <!--location-->
            <div class="flex justify-between bg-gray-50 border border-gray-300 rounded p-2 w-[50px]">
              <button class="mt-1 text-primary text-sm font-semibold !rounded-button">
                <svg class="h-8 w-8 text-red-500"  fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
              </button>
            </div>
            <!-- search bar -->
            <div class="relative flex-grow">
              <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                <div class="w-6 h-6 flex items-center justify-center text-gray-500">
                  <i class="ri-search-line ri-lg"></i>
                </div>
              </div>
              <input
                type="text"
                class="w-full pl-12 pr-4 py-3 text-lg bg-gray-50 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary"
                placeholder="Search for products..."/>
            </div>
            <!-- cart -->
            <div class="flex items-center bg-gray-50 border border-gray-300 rounded p-3 min-w-[220px]">
              <div class="relative mr-4">
                <div class="w-10 h-10 flex items-center justify-center text-primary">
                  <i class="ri-shopping-cart-2-line ri-2x"></i>
                </div>
                <span class="cart-badge flex items-center justify-center w-6 h-6 bg-primary text-white text-xs font-bold rounded-full">0</span>
              </div>
              <div>
                <p class="text-sm text-gray-600">
                  Total: <span class="font-bold text-gray-800">₹0</span>
                </p>
                <button class="mt-1 text-primary text-sm font-semibold !rounded-button">
                  View Cart
                </button>
              </div>
            </div>
          </div>
        </div>
      </header>
      <!--cate head-->
      <main class="container mx-auto px-6 py-8">
        <div id="dairy-section" class="flex items-center gap-4 mb-8">
          <button
            onclick="history.back()"
            class="w-10 h-10 flex items-center justify-center bg-white border border-gray-300 rounded-full shadow-sm hover:bg-gray-50 !rounded-button">
            <i class="ri-arrow-left-s-line ri-lg"></i>
          </button>
          <h1 class="text-3xl font-bold text-gray-800">Dairy</h1>
        </div>
        <!-- cate filter -->
        <div class="flex gap-3 mb-8 overflow-x-auto pb-2">
          <button class="bg-primary text-white px-4 py-2 rounded-full text-sm font-medium !rounded-button whitespace-nowrap">
            All Items
          </button>
          <button class="bg-white text-gray-700 px-4 py-2 rounded-full text-sm font-medium border border-gray-300 hover:bg-gray-50 !rounded-button whitespace-nowrap">
            Milk
          </button>
          <button class="bg-white text-gray-700 px-4 py-2 rounded-full text-sm font-medium border border-gray-300 hover:bg-gray-50 !rounded-button whitespace-nowrap">
            Cheese
          </button>
          <button class="bg-white text-gray-700 px-4 py-2 rounded-full text-sm font-medium border border-gray-300 hover:bg-gray-50 !rounded-button whitespace-nowrap">
            Yogurt
          </button>
          <button class="bg-white text-gray-700 px-4 py-2 rounded-full text-sm font-medium border border-gray-300 hover:bg-gray-50 !rounded-button whitespace-nowrap">
            Butter
          </button>
          <button class="bg-white text-gray-700 px-4 py-2 rounded-full text-sm font-medium border border-gray-300 hover:bg-gray-50 !rounded-button whitespace-nowrap">
            Organic
          </button>
        </div>
        <!-- filter sort -->
        <div class="flex justify-between items-center mb-6">
          <div class="flex items-center gap-4">
            <div class="relative">
              <button class="flex items-center gap-2 bg-white px-4 py-2 rounded-lg border border-gray-300 text-sm font-medium hover:bg-gray-50 !rounded-button">
                <i class="ri-filter-3-line"></i>
                Filters
                <i class="ri-arrow-down-s-line"></i>
              </button>
            </div>
            <div class="relative">
              <button class="flex items-center gap-2 bg-white px-4 py-2 rounded-lg border border-gray-300 text-sm font-medium hover:bg-gray-50 !rounded-button">
                <i class="ri-sort-desc"></i>
                Sort by: Price
                <i class="ri-arrow-down-s-line"></i>
              </button>
            </div>
          </div>
          <div class="text-sm text-gray-600">Showing 8 items</div>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
          <!--1-->
          <div class="product-card bg-white rounded-lg shadow-md overflow-hidden">
            <div class="h-48 bg-gray-200">
              <img
                src="https://i.pinimg.com/736x/55/81/9c/55819c086a50d8c11c6d629a99fce59e.jpg"
                alt="Organic Whole Milk"
                class="w-full h-full object-cover object-top"/>
            </div>
            <div class="p-4">
              <div class="flex items-center gap-2 mb-2">
                <span class="bg-blue-100 text-blue-800 text-xs font-medium px-2 py-1 rounded">Organic</span>
              </div>
              <h3 class="font-semibold text-gray-800">Organic Whole Milk</h3>
              <!-- <p class="text-sm text-gray-600 mt-1">Farm Fresh</p> -->
              <div class="flex justify-between items-center mt-3">
                <p class="font-bold text-primary">₹90/L</p>
                <button class="bg-primary text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-red-700 !rounded-button whitespace-nowrap">
                  Add to Cart
                </button>
              </div>
            </div>
          </div>
          <!--2-->
          <div class="product-card bg-white rounded-lg shadow-md overflow-hidden">
            <div class="h-48 bg-gray-200">
              <img
                src="https://dfwblobstorage.blob.core.windows.net/ewcmediacontainer/eatwisconsincheese/media/content/cheesemasters-2019/aging-cheese-cheddar.jpg"
                alt="Aged Cheddar"
                class="w-full h-full object-cover object-top"/>
            </div>
            <div class="p-4">
              <div class="flex items-center gap-2 mb-2">
                <span class="bg-blue-100 text-blue-800 text-xs font-medium px-2 py-1 rounded">Imported</span>
              </div>
              <h3 class="font-semibold text-gray-800">Aged Cheddar</h3>
              <!-- <p class="text-sm text-gray-600 mt-1">Sharp & Rich</p> -->
              <div class="flex justify-between items-center mt-3">
                <p class="font-bold text-primary">₹2500</p>
                <button
                  class="bg-primary text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-red-700 !rounded-button whitespace-nowrap">
                  Add to Cart
                </button>
              </div>
            </div>
          </div>
          <!--3-->
          <div class="product-card bg-white rounded-lg shadow-md overflow-hidden">
            <div class="h-48 bg-gray-200">
              <img
                src="https://www.hungryhappyhome.com/wp-content/uploads/2021/05/Greek-Yogurt-Breakfast-Bowls-2021-7.png"
                alt="Greek Yogurt"
                class="w-full h-full object-cover object-top"/>
            </div>
            <div class="p-4">
              <div class="flex items-center gap-2 mb-2">
                <span class="bg-blue-100 text-blue-800 text-xs font-medium px-2 py-1 rounded">Premium</span>
              </div>
              <h3 class="font-semibold text-gray-800">Greek Yogurt</h3>
              <!-- <p class="text-sm text-gray-600 mt-1">Creamy & Rich</p> -->
              <div class="flex justify-between items-center mt-3">
                <p class="font-bold text-primary">₹250</p>
                <button class="bg-primary text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-red-700 !rounded-button whitespace-nowrap">
                  Add to Cart
                </button>
              </div>
            </div>
          </div>
          <!--4-->
          <div class="product-card bg-white rounded-lg shadow-md overflow-hidden">
            <div class="h-48 bg-gray-200">
              <img
                src="https://assets.epicurious.com/photos/6442a468669c5dd2beceb800/1:1/w_4041,h_4041,c_limit/ButterStorage_HERO_042023_51525.jpg"
                alt="European Butter"
                class="w-full h-full object-cover object-top"/>
            </div>
            <div class="p-4">
              <div class="flex items-center gap-2 mb-2">
                <span class="bg-blue-100 text-blue-800 text-xs font-medium px-2 py-1 rounded">Imported</span>
              </div>
              <h3 class="font-semibold text-gray-800">European Butter</h3>
              <!-- <p class="text-sm text-gray-600 mt-1">Rich & Creamy</p> -->
              <div class="flex justify-between items-center mt-3">
                <p class="font-bold text-primary">₹590</p>
                <button class="bg-primary text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-red-700 !rounded-button whitespace-nowrap">
                  Add to Cart
                </button>
              </div>
            </div>
          </div>
          <!--5-->
          <div class="product-card bg-white rounded-lg shadow-md overflow-hidden">
            <div class="h-48 bg-gray-200">
              <img
                src="https://www.trigs.com/application/files/cache/thumbnails/belgioiosio-fresh-mozzarella-products-img-22e8f0cbcd16f89420373cee4b8bad68.jpg"
                alt="Fresh Mozzarella"
                class="w-full h-full object-cover object-top"/>
            </div>
            <div class="p-4">
              <div class="flex items-center gap-2 mb-2">
                <span class="bg-blue-100 text-blue-800 text-xs font-medium px-2 py-1 rounded">Fresh</span>
              </div>
              <h3 class="font-semibold text-gray-800">Fresh Mozzarella</h3>
              <!-- <p class="text-sm text-gray-600 mt-1">Italian Style</p> -->
              <div class="flex justify-between items-center mt-3">
                <p class="font-bold text-primary">₹450</p>
                <button class="bg-primary text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-red-700 !rounded-button whitespace-nowrap">
                  Add to Cart
                </button>
              </div>
            </div>
          </div>
          <!--6-->
          <div class="product-card bg-white rounded-lg shadow-md overflow-hidden">
            <div class="h-48 bg-gray-200">
              <img
                src="https://s3.amazonaws.com/grazecart/beilerfamilyfarm/images/1601162136_5f6fcb98274c5.jpg"
                alt="Heavy Cream"
                class="w-full h-full object-cover object-top"/>
            </div>
            <div class="p-4">
              <div class="flex items-center gap-2 mb-2">
                <span class="bg-blue-100 text-blue-800 text-xs font-medium px-2 py-1 rounded">Organic</span>
              </div>
              <h3 class="font-semibold text-gray-800">Heavy Cream</h3>
              <!-- <p class="text-sm text-gray-600 mt-1">Farm Fresh</p> -->
              <div class="flex justify-between items-center mt-3">
                <p class="font-bold text-primary">₹450</p>
                <button class="bg-primary text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-red-700 !rounded-button whitespace-nowrap">
                  Add to Cart
                </button>
              </div>
            </div>
          </div>
          <!--7-->
          <div class="product-card bg-white rounded-lg shadow-md overflow-hidden">
            <div class="h-48 bg-gray-200">
              <img
                src="https://www.greendna.in/cdn/shop/products/curd_fde822bd-928e-43ce-a12e-d4c06e3b80a1.jpg?v=1626803363"
                alt="Cottage Cheese"
                class="w-full h-full object-cover object-top"/>
            </div>
            <div class="p-4">
              <div class="flex items-center gap-2 mb-2">
                <span class="bg-blue-100 text-blue-800 text-xs font-medium px-2 py-1 rounded">Fresh</span>
              </div>
              <h3 class="font-semibold text-gray-800">Cottage Cheese</h3>
              <!-- <p class="text-sm text-gray-600 mt-1">Low Fat</p> -->
              <div class="flex justify-between items-center mt-3">
                <p class="font-bold text-primary">₹310</p>
                <button class="bg-primary text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-red-700 !rounded-button whitespace-nowrap">
                  Add to Cart
                </button>
              </div>
            </div>
          </div>
          <!--8-->
          <div class="product-card bg-white rounded-lg shadow-md overflow-hidden">
            <div class="h-48 bg-gray-200">
              <img
                src="https://www.realsimple.com/thmb/WIQw_c6ePyPKkXAGrFVB5hvMN_A=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/make-sour-cream-2000-513d49b3aaba4708a67b19380cc32de6.jpg"
                alt="Sour Cream"
                class="w-full h-full object-cover object-top"/>
            </div>
            <div class="p-4">
              <div class="flex items-center gap-2 mb-2">
                <span class="bg-blue-100 text-blue-800 text-xs font-medium px-2 py-1 rounded">Organic</span>
              </div>
              <h3 class="font-semibold text-gray-800">Sour Cream</h3>
              <!-- <p class="text-sm text-gray-600 mt-1">Rich & Tangy</p> -->
              <div class="flex justify-between items-center mt-3">
                <p class="font-bold text-primary">₹250</p>
                <button class="bg-primary text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-red-700 !rounded-button whitespace-nowrap">
                  Add to Cart
                </button>
              </div>
            </div>
          </div>
        </div>
        <!-- page no. -->
        <div class="flex justify-center items-center gap-2 mt-12">
          <button class="w-10 h-10 flex items-center justify-center bg-white border border-gray-300 rounded-full shadow-sm hover:bg-gray-50 !rounded-button">
            <i class="ri-arrow-left-s-line ri-lg"></i>
          </button>
          <button class="w-10 h-10 flex items-center justify-center bg-primary text-white rounded-full shadow-sm !rounded-button">
            1
          </button>
          <button class="w-10 h-10 flex items-center justify-center bg-white border border-gray-300 rounded-full shadow-sm hover:bg-gray-50 !rounded-button">
            2
          </button>
          <button class="w-10 h-10 flex items-center justify-center bg-white border border-gray-300 rounded-full shadow-sm hover:bg-gray-50 !rounded-button">
            3
          </button>
          <button class="w-10 h-10 flex items-center justify-center bg-white border border-gray-300 rounded-full shadow-sm hover:bg-gray-50 !rounded-button">
            <i class="ri-arrow-right-s-line ri-lg"></i>
          </button>
        </div>  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
