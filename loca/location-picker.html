<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pick Location</title>
  <style>
    #map { height: 100%; width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    let map, marker;

    function initMap() {
      const defaultLocation = { lat: 28.6139, lng: 77.2090 }; // Default to New Delhi

      map = new google.maps.Map(document.getElementById('map'), {
        center: defaultLocation,
        zoom: 13
      });

      marker = new google.maps.Marker({
        position: defaultLocation,
        map: map,
        draggable: true
      });

      map.addListener('click', function(event) {
        marker.setPosition(event.latLng);
        document.getElementById('lat').value = event.latLng.lat();
        document.getElementById('lng').value = event.latLng.lng();
      });
    }

    function saveLocation() {
      const lat = document.getElementById('lat').value;
      const lng = document.getElementById('lng').value;
      const address = document.getElementById('address').value;
      // Save the location data (e.g., send to server or store locally)
      console.log(`Address: ${address}, Latitude: ${lat}, Longitude: ${lng}`);
    }
  </script>
  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap" async defer></script>
</body>
</html>
