<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Select Your Location</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1>Select Your Location</h1>

  <!-- City Dropdown -->
  <select id="city-select">
    <option value="">Select a City</option>
    <option value="30.324860,78.043613">Dehradun</option>
    <option value="28.6139,77.2090">New Delhi</option>
    <option value="19.0760,72.8777">Mumbai</option>
    <option value="12.9716,77.5946">Bangalore</option>
    <option value="13.0827,80.2707">Chennai</option>
    <option value="22.5726,88.3639">Kolkata</option>
    <option value="17.3850,78.4867">Hyderabad</option>
  </select>

  <div id="map"></div>

  <input type="text" id="lat" placeholder="Latitude" readonly />
  <input type="text" id="lng" placeholder="Longitude" readonly />
  <br />
  <button onclick="saveLocation()">Confirm Location</button>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
