<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout | MEGA MART</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#e53e3e',
            secondary: '#4299e1',
          },
          borderRadius: {
            button: '8px',
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="min-h-screen bg-gray-50 font-['Poppins']">

  <!-- HEADER -->
  <header class="bg-white shadow-md py-4 px-6">
    <div class="container mx-auto">
      <div class="flex justify-center mb-6">
        <h1 class="text-4xl font-['Pacifico'] text-primary">MEGA MART</h1>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="container mx-auto px-6 py-10">
    <div class="mb-8 flex items-center gap-4">
      <button onclick="history.back()" class="w-10 h-10 flex items-center justify-center bg-white border border-gray-300 rounded-full shadow-sm hover:bg-gray-50">
        <i class="ri-arrow-left-s-line ri-lg"></i>
      </button>
      <h1 class="text-3xl font-bold text-gray-800">Checkout</h1>
    </div>

    <!-- Checkout Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <!-- Order Summary -->
      <div>
        <h2 class="text-xl font-semibold mb-4">Order Summary</h2>
        <div class="space-y-4">
          <!-- Sample Cart Item -->
          <div class="flex justify-between items-center bg-white p-4 rounded-lg shadow-sm">
            <div>
              <h3 class="font-medium text-gray-800">Organic Apples</h3>
              <p class="text-sm text-gray-600">₹320 x 2 kg</p>
            </div>
            <p class="font-semibold text-primary">₹640</p>
          </div>
          <div class="flex justify-between items-center bg-white p-4 rounded-lg shadow-sm">
            <div>
              <h3 class="font-medium text-gray-800">Fresh Bananas</h3>
              <p class="text-sm text-gray-600">₹90 x 1 kg</p>
            </div>
            <p class="font-semibold text-primary">₹90</p>
          </div>
          <div class="flex justify-between items-center bg-white p-4 rounded-lg shadow-sm">
            <div>
              <h3 class="font-medium text-gray-800">Bell Peppers</h3>
              <p class="text-sm text-gray-600">₹70 x 1 kg</p>
            </div>
            <p class="font-semibold text-primary">₹70</p>
          </div>
        </div>

        <!-- Totals -->
        <div class="mt-6 bg-white p-4 rounded-lg shadow-md space-y-2">
          <div class="flex justify-between text-sm text-gray-700">
            <span>Subtotal</span>
            <span>₹800</span>
          </div>
          <div class="flex justify-between text-sm text-gray-700">
            <span>Tax (5%)</span>
            <span>₹40</span>
          </div>
          <div class="flex justify-between text-lg font-semibold text-gray-800 border-t pt-2">
            <span>Total</span>
            <span>₹840</span>
          </div>
        </div>
      </div>

      <!-- Billing Info -->
      <div>
        <h2 class="text-xl font-semibold mb-4">Billing Information</h2>
        <form class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700">Full Name</label>
            <input type="text" class="w-full mt-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary" placeholder="John Doe" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Email</label>
            <input type="email" class="w-full mt-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary" placeholder="john@example.com" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Phone</label>
            <input type="tel" class="w-full mt-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary" placeholder="9876543210" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Address</label>
            <div class="flex gap-2">
                <textarea
                    id="address"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary"
                    rows="3"
                    placeholder="123 Street, City, State"></textarea>
                    <a href="\mart\loca\location-picker.html">
                        <button
                        id="loca"
                        type="button"
                        onclick="window.location.href='location-picker.html'"
                        class="bg-secondary text-white px-4 py-2 rounded-lg hover:bg-red-600 flex items-center justify-center">
                        <i class="ri-map-pin-line mr-1"></i> Pick
                        </button>
                    </a>
            </div>
          </div>
          <button type="submit" class="w-full bg-primary text-white py-3 rounded-lg text-lg font-medium hover:bg-red-700 transition">
            Confirm Purchase
          </button>
        </form>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
